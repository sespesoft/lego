services:
  rabbitmq:
    container_name: infra-rabbitmq
    image: rabbitmq:3.13.6-management-alpine
    ports:
      - target: 15672
        published: 8072
        protocol: tcp
        mode: host
    environment:
      RABBITMQ_DEFAULT_USER: ${MQ_USER}
      RABBITMQ_DEFAULT_PASS: ${MQ_PASSWORD}
      RABBITMQ_NODENAME: rabbit@rabbitmq
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"]
      interval: 30s
      timeout: 10s
      retries: 6
      start_period: 80s
    profiles:
      - all
      - infra
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: 
          - node.labels.edge == true
volumes:
  rabbitmq_data:
