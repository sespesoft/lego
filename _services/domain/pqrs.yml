services:
  pqrs:
    extends:
      file: ./environment/${ENV}.yml
      service: pqrs
    environment:
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PATH_PUBLICKEY: ${PUB_KEY}
      URL_DOCUMENT: http://audit/api/auth/
      MQ_DRIVE: ${MQ_DRIVE}
      MQ_USER: ${MQ_USER}
      MQ_PASSWORD: ${MQ_PASSWORD}
      MQ_HOST: ${MQ_HOST}
      MQ_PORT: ${MQ_PORT}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_KEY}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET}
      AWS_ENDPOINT: ${BUCKET_HOST}
      AWS_BUCKET: ${BUCKET_NAME}
    restart: unless-stopped
    profiles:
      - all
      - app
    configs:
      - source: pub_key
        target: /rsa/pub/key.pem
    labels:
      - traefik.enable=true
      - traefik.http.services.pqr.loadbalancer.server.port=80
      - traefik.http.routers.pqr.rule=Host(`pqrs.${DOMAIN}`)
      - service.role=app

  job_pqrs:
    extends:
      file: ./environment/${ENV}.yml
      service: job_pqrs
    environment:
      DB_HOST: ${DB_HOST}
      DB_DATABASE: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PATH_PUBLICKEY: ${PUB_KEY}
      MQ_DRIVE: ${MQ_DRIVE}
      MQ_USER: ${MQ_USER}
      MQ_PASSWORD: ${MQ_PASSWORD}
      MQ_HOST: ${MQ_HOST}
      MQ_PORT: ${MQ_PORT}
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_KEY}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET}
    user: application
    profiles:
      - all
      - job
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        php app/ice dbup --schema=[!t]* --tag=pqrs
        php app/ice configure-message-queue
    restart: on-failure
    labels:
      - service.role=job
