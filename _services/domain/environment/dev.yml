x-config-job: &config-job
  environment:
    ENABLED_MODULES: ${ENABLE_MODULES}
  restart: on-failure
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
services:
  webapp:
    build:
      context: ../../../webapp
      additional_contexts:
        - assets=../../../_assets
    labels:
      - traefik.http.routers.webapp.entrypoints=web
  audit:
    build:
      context: ../../../audit
    labels:
      - traefik.http.routers.audit.entrypoints=web
  job_audit:
    build:
      context: ../../../audit
    <<: *config-job
  auth:
    build:
      context: ../../../auth
    labels:
      - traefik.http.routers.auth.entrypoints=web
  job_auth:
    build:
      context: ../../../auth
    <<: *config-job
  geo:
    build:
      context: ../../../geo
    labels:
      - traefik.http.routers.geo.entrypoints=web
  job_geo:
    build:
      context: ../../../geo
    <<: *config-job
  hiring:
    build:
      context: ../../../hiring
    labels:
      - traefik.http.routers.hiring.entrypoints=web
  job_hiring:
    build:
      context: ../../../hiring
    <<: *config-job
  pgaudit:
    build:
      context: ../../../pgaudit-api
    labels:
      - traefik.http.routers.pga.entrypoints=web
  job_pgaudit:
    build:
      context: ../../../pgaudit-api
    <<: *config-job
  pqrs:
    build:
      context: ../../../pqrs
    labels:
      - traefik.http.routers.pqr.entrypoints=web
  job_pqrs:
    build:
      context: ../../../pqrs
    <<: *config-job
  notify:
    build:
      context: ../../../notify-soketi
    labels:
      - traefik.http.routers.notify.entrypoints=web
  soketi:
    environment:
      SOKETI_DEBUG: true
    labels:
      - traefik.http.routers.soketi.entrypoints=web
  job_notify:
    build:
      context: ../../../notify-soketi
    <<: *config-job
