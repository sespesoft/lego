x-deploy-app: &deploy-app
  mode: replicated
  replicas: 1
  placement:
    constraints:
      - node.labels.role == app
x-config-srv: &config-srv
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
services:
  grafana:
    <<: *config-srv
    labels: &grafana-tls-labels
      - traefik.http.routers.grafana.tls=true
    deploy:
      <<: *deploy-app
      labels: *grafana-tls-labels
  superset:
    <<: *config-srv
    labels: &superset-tls-labels
      - traefik.http.routers.superset.tls=true
    deploy:
      <<: *deploy-app
      labels: *superset-tls-labels
  jasper:
    <<: *config-srv
    labels: &jasper-tls-labels
      - traefik.http.routers.bi.tls=true
    deploy:
      <<: *deploy-app
      labels: *jasper-tls-labels
  n8n:
    <<: *config-srv
    labels: &n8n-tls-labels
      - traefik.http.routers.n8n.tls=true
    deploy:
      <<: *deploy-app
      labels: *n8n-tls-labels
